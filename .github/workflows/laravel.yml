name: Deploy Laravel Gastos to Nomad

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Check out del código directo al NFS 📂
        uses: actions/checkout@v4

      # 🧪 EJEMPLO FUTURO DE TEST: 
      # Si necesitás usar tu imagen de deploys para testear, podés correr un contenedor aislado temporal así:
      # - name: Ejecutar Tests dentro de tu contenedor de sistemas 🧪
      #   run: |
      #     docker run --rm -v ${{ github.workspace }}:/app -w /app registry.sistemas:5000/jcastellano/deploys:latest php artisan test

      - name: Instalar CLI de Nomad en caliente 🛠️
        run: |
          if ! command -v nomad &> /dev/null; then
            curl -fsSL https://releases.hashicorp.com/nomad/1.8.1/nomad_1.8.1_linux_amd64.zip -o nomad.zip
            unzip nomad.zip
            sudo mv nomad /usr/local/bin/
            rm nomad.zip
          fi

      - name: Desplegar en Nomad Server 🚀
        run: |
          export NOMAD_ADDR="${{ secrets.SERVER_NOMAD }}"
          nomad job run laravel.nomad.hcl
