name: Deploy Laravel Gastos to Nomad

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Check out del código directo al NFS 📂
        uses: actions/checkout@v4

      - name: Instalar CLI de Nomad en el Runner (Limpieza y Forzado) 🛠️
        run: |
          # 1. Borramos CUALQUIER rastro de un binario anterior roto
          sudo rm -f /usr/local/bin/nomad
          
          # 2. Obtener la arquitectura exacta del sistema
          RAW_ARCH=$(uname -m)
          echo "Arquitectura cruda detectada por el sistema: $RAW_ARCH"
          
          # 3. Normalizar la arquitectura para HashiCorp Nomad
          case "$RAW_ARCH" in
            x86_64|amd64)
              NOMAD_ARCH="amd64"
              ;;
            aarch64|arm64|armv8*)
              NOMAD_ARCH="arm64"
              ;;
            armv7*|armhf)
              NOMAD_ARCH="arm"
              ;;
            i386|i686)
              NOMAD_ARCH="386"
              ;;
            *)
              echo "Error: Arquitectura desconocida ($RAW_ARCH)" && exit 1
              ;;
          esac
          
          echo "Descargando e instalando binario limpio de Nomad para: $NOMAD_ARCH"
          
          # 4. Descargar, descomprimir e instalar de forma limpia
          curl -fsSL "https://releases.hashicorp.com/nomad/1.8.1/nomad_1.8.1_linux_${NOMAD_ARCH}.zip" -o nomad.zip
          unzip -o nomad.zip # El flag -o fuerza a sobreescribir si quedara algo
          sudo mv nomad /usr/local/bin/
          rm -f nomad.zip

      - name: Desplegar en Nomad Server 🚀
        run: |
          export NOMAD_ADDR="${{ secrets.SERVER_NOMAD }}"
          /usr/local/bin/nomad job run laravel.nomad.hcl
